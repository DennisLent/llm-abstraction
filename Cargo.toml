[package]
name = "core_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "core_rust"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "core_binary"
path = "src/main.rs"

[dependencies]
rand = "0.9.1"
thiserror = "2.0.12"
ordered-float = "5.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pyo3 = { version = "0.24.2", features = ["extension-module"] }
plotters = "0.3.7"
pythonize = "0.24"
rayon = "1.10.0"