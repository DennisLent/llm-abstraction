name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt, clippy, llvm-tools-preview
          override: true
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Rust coverage (lcov)
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov
      - name: Python lint
        run: flake8
      - name: Python tests with coverage (xml)
        run: |
          python -m pytest --cov=llm_abstraction --cov=main.py --cov-report=xml:coverage.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info, coverage.xml
          flags: rust,python
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
