name: Deploy Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Rust build)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install mkdocs-material

      - name: Build Rust crate docs (rustdoc)
        run: |
          cargo doc --no-deps --workspace

      - name: Bundle rustdoc into MkDocs sources
        run: |
          rm -rf docs/rustdoc
          mkdir -p docs/rustdoc
          cp -a target/doc/. docs/rustdoc/

      - run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
