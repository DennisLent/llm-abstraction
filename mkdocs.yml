site_name: LLM-Based State Abstraction
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - toc.integrate
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.pathconverter
extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - js/mermaid-init.js
repo_url: https://github.com/DennisLent/llm-abstraction
repo_name: GitHub
nav:
  - Home: index.md
  - Idea:
      - idea/index.md
  - Thesis:
      - Overview: thesis/overview.md
      - Background: thesis/background.md
      - Methodology: thesis/methodology.md
      - Experiments & Results: thesis/experiments_results.md
      - Conclusion & Future Work: thesis/conclusion.md
      - Glossary: thesis/glossary.md
  - Repo:
      - Architecture: repo/architecture.md
      - Data Flow: repo/data_flow.md
      - Modules: repo/modules.md
      - Quickstart: repo/quickstart.md
      - CLI Reference: repo/cli.md
      - Configuration: repo/configuration.md
      - Outputs & Artifacts: repo/outputs.md
      - API (Python): repo/api_python.md
      - API (Rust): repo/api_rust.md
      - Reproducing the Thesis: repo/reproduce.md
      - Development: repo/development.md
  - Prompts & Models:
      - Prompt Library: prompts/index.md
      - Models Evaluated: models/index.md
      - Maps & Abstractability: maps/index.md
