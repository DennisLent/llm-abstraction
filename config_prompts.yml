# This file contains all prompt composition elements. Prompts are comprised of these elements. Each element has an id (unique) and value.
# Each prompt is comprised of:
# 1 instruction: each prompt needs an instruction i.e. call to action what to do
# 1 necessary context: a context that is needed to describe the nature of the problem. Anything marked with necessary
# n contexts: can use any amount of contexts you want to help the LLM produce a good result.
# 1 output: a proper prompt needs to specify the output that is desired for usage / futher processing

instruction:
  - id: "basic1"
    val: "Please group these states into abstract states."
  - id: "basic2"
    val: "Each state presents a unique position for the player in a grid world. Please group the states into abstract states."
  - id: "basic3"
    val: "Each state presents a unique position for the player in a grid world. Please group the states without coding."
  - id: "basic4"
    val: "Each state presents a unique position for the player in a grid world. Do not return any code."
  - id: "cot1"
    val: "Think step by step and group these states into abstract states."
  - id: "cot2"
    val: "Each state presents a unique position for the player in a grid world. Think step by step and group these states into abstract states."
  - id: "relation1"
    val: "Group these states based on their spatial relation and behavior."
  - id: "relation2"
    val: "Each state presents a unique position for the player in a grid world. Group these states based on their spatial relation and behavior."
  - id: "role1"
    val: "You are an expert in decision-making working on a grid world environment."
  - id: "role2"
    val: "You are a decision-making assistant working in a grid world environment."
  - id: "role3"
    val: "Imagine you are teaching a new student about state abstraction in a grid world."
  - id: "gpt1"
    val: "Please create an abstraction by grouping states into clusters. The abstraction should reflect symmetries in state connectivity and their relation to the goal."
  - id: "gpt2"
    val: "Consider that you have prior knowledge that corner states and edge states behave differently than center states."
  - id: "hierarchy1"
    val: "Construct a hierarchical abstraction of the 3x3 state space into at least two levels: a fine-grained intermediate abstraction and a more coarse final abstraction."

necessary_context:
  - id: "necessary-domain1"
    val: "The grid world always has the goal located in the bottom right corner of the map."
  - id: "necessary-domain2"
    val: "The goal is always at the last state. Movements are allowed up/down/left/right if not blocked by the grid boundary."
  - id: "domain2"
    val: "Some tiles may represent obstacles that the agent cannot traverse."

context:
  - id: "domain2"
    val: "Some tiles may represent obstacles that the agent cannot traverse."
  - id: "domain3"
    val: "Adjacent states in the grid are connected based on valid movements in the cardinal directions (up, down, left, right)."
  - id: "performance1"
    val: "Efficient state abstraction helps reduce the computational complexity during planning."
  - id: "performance2"
    val: "The ideal abstraction should enable the agent to solve the game."
  - id: "performance3"
    val: "Your response will be benchmarked against the pre-calculated optimal solution."
  - id: "efficiency"
    val: "The agent must navigate the grid efficiently."
  - id: "role1"
    val: "Explain your reasoning step-by-step as if instructing a learner. Make sure the explanation is accessible and non-technical."
  - id: "background1"
    val: "An abstract state is a group of ground states that can lead to the same distribution of next abstract states under symmetries of actions."
  - id: "background2"
    val: "An abstract state is a group of ground states that can lead to the same distribution of next ground states under symmetries of actions."
  - id: "background3"
    val: "A good abstraction considers the symmetries in the world that can be exploited to group ground states."
  - id: "background4"
    val: "A good abstraction considers the symmetries in both states and actions."
  - id: "test1"
    val: "Each abstract state should correspond to a set of original states that function similarly from the agents perspective, both structurally (adjacent connections) and in terms of distance to the goal."
  - id: "test2"
    val: "Using the 3x3 grid with states 0 to 8, propose an abstraction that leverages these known differences."
  - id: "test3"
    val: "States are considered equivalent if the optimal actions and expected value from following the policy are effectively the same. Based on this principle, cluster the states into abstract states."
  - id: "assumption"
    val: "When clustering states into abstract states, consider not only the state layout but also the action set (up, down, left, right). Show how certain states are interchangeable if we rotate or reflect the grid, keeping the action semantics aligned."

output:
  - id: "out1"
    val: "Do not return any text, only the grouping of the states."
  - id: "out2"
    val: "Do not return any text, only the grouping in form list[list[int]]."
  - id: "out3"
    val: "Output the groups as a list of state clusters."
  - id: "out4"
    val: "Output the rationale for the state groupings alongisde the clustering itself."
  - id: "out5"
    val: "Provide the final abstract clusters."